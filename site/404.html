<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140807">
<title>Page Not Found | Bharathashetra School of Dance</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#140807;--gold:#C9993A;--gold-lt:#E8C97A;--cream:#F2E7D0;
  --muted:rgba(242,231,208,.62);--hair:rgba(201,153,58,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--ink);color:var(--cream);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.8;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 55% at 50% -10%, rgba(110,20,20,.42), transparent 62%);
}
.box{position:relative;z-index:1;max-width:560px}
img.logo{width:74px;height:74px;border-radius:50%;border:1px solid var(--hair);margin:0 auto 30px}
.code{
  font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.5em;
  text-transform:uppercase;color:var(--gold);margin-bottom:22px;
}
h1{
  font-family:'Cinzel Decorative',cursive;font-weight:700;
  font-size:clamp(26px,5vw,40px);color:var(--cream);line-height:1.34;letter-spacing:.02em;
}
.rule{width:170px;height:1px;margin:28px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
p{color:var(--muted);font-style:italic;font-size:21px}
.cta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-block;padding:14px 34px;border-radius:2px;
  font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;text-decoration:none;
  transition:all .35s cubic-bezier(.2,.7,.3,1);
}
.a{border:1px solid var(--gold);color:var(--gold-lt)}
.a:hover{background:var(--gold);color:var(--ink);transform:translateY(-2px)}
.b{border:1px solid rgba(242,231,208,.22);color:var(--muted)}
.b:hover{border-color:var(--gold);color:var(--gold-lt);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="images/logo.png" alt="" onerror="this.remove()">
    <div class="code">Error 404</div>
    <h1>This Page Has<br>Left the Stage</h1>
    <div class="rule"></div>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="cta">
      <a class="btn a" href="/">Return Home</a>
      <a class="btn b" href="/#contact">Contact Us</a>
    </div>
  </div>
</body>
</html>
